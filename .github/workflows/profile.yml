name: Profile
on:
  # Schedule updates (each day)
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build SVGs
        run: node build.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          TZ: Europe/Berlin
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_author: ''
